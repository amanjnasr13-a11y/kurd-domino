<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>دامەی کوردیی پرۆفیشناڵ</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #111a2e 0%, #060a12 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.94);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .lobby-card {
      background: #111a2d;
      border: 2px solid #283d63;
      border-radius: 20px;
      padding: 24px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
    }
    .lobby-input {
      width: 100%;
      background: #090e18;
      border: 1px solid #334155;
      color: #fff;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      font-weight: 700;
      margin: 8px 0;
    }
    .room-tabs {
      display: flex;
      gap: 8px;
      margin: 12px 0 6px 0;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #f59e0b;
      color: #0b111e;
      border-color: #f59e0b;
    }
    .primary-play-btn {
      width: 100%;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0b111e;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      margin-top: 10px;
    }

    .top-bar {
      width: 100%;
      max-width: 520px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
    }
    .score-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 90px;
    }
    .score-num { font-size: 26px; font-weight: 900; line-height: 1; }
    .score-label { font-size: 11px; color: #94a3b8; font-weight: 700; margin-top: 2px; }
    .title-pill {
      background: #0f172a;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .board-wrapper {
      position: relative;
      padding: 8px;
      background: #eab308;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 20px rgba(234, 179, 8, 0.3);
    }
    .dama-board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: min(88vw, 440px);
      height: min(88vw, 440px);
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid #000;
    }
    .cell {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .row-red { background-color: #b91c1c; }
    .row-red-alt { background-color: #991b1b; }
    .row-white { background-color: #e2e8f0; }
    .row-white-alt { background-color: #cbd5e1; }
    .row-green { background-color: #15803d; }
    .row-green-alt { background-color: #166534; }

    .cell.selected { box-shadow: inset 0 0 0 3px #f59e0b; }
    .cell.target-hint::after {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(253, 224, 71, 0.7);
      box-shadow: 0 0 10px #facc15;
      pointer-events: none;
    }

    .piece {
      width: 82%;
      height: 82%;
      border-radius: 50%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 5;
    }
    .piece-black {
      background: radial-gradient(circle at 35% 35%, #475569 0%, #1e293b 50%, #0f172a 100%);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.7);
      border: 1.5px solid #0f172a;
    }
    .piece-white {
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #f1f5f9 60%, #cbd5e1 100%);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.7);
      border: 1.5px solid #94a3b8;
    }
    .king-crown { font-size: 19px; line-height: 1; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8)); }
    .piece-black .king-crown { color: #f59e0b; }
    .piece-white .king-crown { color: #b45309; }

    .bottom-bar { margin-bottom: 14px; display: flex; gap: 12px; }
    .btn-action {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="lobby-modal" class="modal-backdrop">
    <div class="lobby-card">
      <div style="font-size: 32px; margin-bottom: 6px;">☀️</div>
      <h2 style="color: #f59e0b; font-size: 20px; font-weight: 900;">دامەی کوردی</h2>
      <p style="font-size: 12px; color: #94a3b8; margin: 6px 0 12px 0;">ناوی خۆت بنووسە بۆ دەستپێکردن</p>

      <input type="text" id="player-name-in" class="lobby-input" placeholder="ناوی خۆت" maxlength="16" value="یاریزان">

      <div class="room-tabs">
        <button class="tab-btn active" id="tab-pub" onclick="switchTab(false)">🌐 گشتی (عالەم)</button>
        <button class="tab-btn" id="tab-priv" onclick="switchTab(true)">🔒 ژووری تایبەت</button>
      </div>

      <div id="private-input-box" style="display: none;">
        <input type="text" id="room-code-in" class="lobby-input" placeholder="کۆدی ژوور بنووسە" maxlength="10">
      </div>

      <button class="primary-play-btn" onclick="joinGame()">دەستپێکردن ➔</button>
    </div>
  </div>

  <div class="top-bar">
    <div class="score-card">
      <div class="score-num" id="black-score" style="color: #cbd5e1;">16</div>
      <div class="score-label" id="black-player-name">کۆمپیوتەر</div>
    </div>

    <div class="title-pill" id="turn-indicator">
      <span>🎯</span> نۆبەی تۆیە
    </div>

    <div class="score-card">
      <div class="score-num" id="white-score" style="color: #ffffff;">16</div>
      <div class="score-label" id="white-player-name">تۆ</div>
    </div>
  </div>

  <div class="board-wrapper">
    <div class="dama-board" id="board"></div>
  </div>

  <div class="bottom-bar">
    <a href="games.html" class="btn-action">گەڕانەوە</a>
  </div>

  <script>
    const socket = typeof io !== 'undefined' ? io() : null;
    let isPrivateMode = false;
    let myColor = 'white';
    let currentTurn = 'white';
    let board = [];
    let selectedCell = null;
    let validMoves = [];
    let isOnlinePeer = false;

    function initBoard() {
      board = Array(8).fill(null).map(() => Array(8).fill(null));
      for (let r = 1; r <= 2; r++) {
        for (let c = 0; c < 8; c++) board[r][c] = { color: 'black', isKing: false };
      }
      for (let r = 5; r <= 6; r++) {
        for (let c = 0; c < 8; c++) board[r][c] = { color: 'white', isKing: false };
      }
      renderBoard();
    }
    initBoard();

    function switchTab(priv) {
      isPrivateMode = priv;
      document.getElementById('tab-pub').classList.toggle('active', !priv);
      document.getElementById('tab-priv').classList.toggle('active', priv);
      document.getElementById('private-input-box').style.display = priv ? 'block' : 'none';
    }

    function joinGame() {
      const name = document.getElementById('player-name-in').value.trim() || 'یاریزان';
      const code = document.getElementById('room-code-in').value.trim();
      document.getElementById('lobby-modal').style.display = 'none';
      document.getElementById('white-player-name').innerText = name;

      myColor = 'white';
      currentTurn = 'white';
      updateStatus();

      if (socket && socket.connected) {
        socket.emit('join_dama', { playerName: name, isPrivate: isPrivateMode, roomCode: code });
        setTimeout(() => {
          if (!isOnlinePeer) {
            document.getElementById('black-player-name').innerText = 'ئەی ئای پرۆفیشناڵ 🧠';
          }
        }, 2500);
      } else {
        document.getElementById('black-player-name').innerText = 'ئەی ئای پرۆفیشناڵ 🧠';
      }
    }

    if (socket) {
      socket.on('dama_joined', (data) => {
        myColor = data.myColor;
      });

      socket.on('dama_start_game', (data) => {
        isOnlinePeer = true;
        board = data.board;
        currentTurn = data.turn;
        document.getElementById('white-player-name').innerText = data.whitePlayer;
        document.getElementById('black-player-name').innerText = data.blackPlayer;
        updateStatus();
        renderBoard();
      });

      socket.on('dama_sync_move', (data) => {
        board = data.board;
        currentTurn = data.turn;
        selectedCell = null;
        validMoves = [];
        updateStatus();
        renderBoard();
        checkGameOver();
      });
    }

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';

      let bCount = 0, wCount = 0;

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';

          if (r < 3) cell.classList.add((r + c) % 2 === 0 ? 'row-red' : 'row-red-alt');
          else if (r < 5) cell.classList.add((r + c) % 2 === 0 ? 'row-white' : 'row-white-alt');
          else cell.classList.add((r + c) % 2 === 0 ? 'row-green' : 'row-green-alt');

          if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
            cell.classList.add('selected');
          }

          const isValid = validMoves.some(m => m.r === r && m.c === c);
          if (isValid) cell.classList.add('target-hint');

          const piece = board[r]?.[c];
          if (piece) {
            if (piece.color === 'black') bCount++;
            if (piece.color === 'white') wCount++;

            const pEl = document.createElement('div');
            pEl.className = `piece piece-${piece.color}`;

            if (piece.isKing) {
              const crown = document.createElement('div');
              crown.className = 'king-crown';
              crown.innerText = '👑';
              pEl.appendChild(crown);
            }
            cell.appendChild(pEl);
          }

          cell.onclick = () => onCellClicked(r, c);
          boardEl.appendChild(cell);
        }
      }

      document.getElementById('black-score').innerText = bCount;
      document.getElementById('white-score').innerText = wCount;
    }

    function onCellClicked(r, c) {
      if (currentTurn !== myColor) return;

      const piece = board[r][c];

      if (piece && piece.color === myColor) {
        selectedCell = { r, c };
        validMoves = getValidMoves(r, c, board);
        renderBoard();
        return;
      }

      if (selectedCell) {
        const move = validMoves.find(m => m.r === r && m.c === c);
        if (move) {
          executeMove(selectedCell, move);
          return;
        }
      }

      selectedCell = null;
      validMoves = [];
      renderBoard();
    }

    function getValidMoves(r, c, b) {
      const piece = b[r][c];
      if (!piece) return [];
      const moves = [];

      if (!piece.isKing) {
        const forward = piece.color === 'white' ? -1 : 1;
        const dirs = [
          { dr: forward, dc: 0 },
          { dr: 0, dc: -1 },
          { dr: 0, dc: 1 }
        ];

        // جووڵەی ئاسایی
        dirs.forEach(d => {
          const nr = r + d.dr, nc = c + d.dc;
          if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8 && !b[nr][nc]) {
            moves.push({ r: nr, c: nc, jumped: null });
          }
        });

        // خواردن
        dirs.forEach(d => {
          const midR = r + d.dr, midC = c + d.dc;
          const tr = r + d.dr * 2, tc = c + d.dc * 2;
          if (tr >= 0 && tr < 8 && tc >= 0 && tc < 8) {
            const opp = b[midR][midC];
            if (opp && opp.color !== piece.color && !b[tr][tc]) {
              moves.push({ r: tr, c: tc, jumped: { r: midR, c: midC } });
            }
          }
        });
      } else {
        // شا (تەیران) بە ٤ ئاراستە
        const dirs = [{ dr: -1, dc: 0 }, { dr: 1, dc: 0 }, { dr: 0, dc: -1 }, { dr: 0, dc: 1 }];
        dirs.forEach(d => {
          let step = 1;
          let opp = null;
          while (true) {
            const nr = r + d.dr * step, nc = c + d.dc * step;
            if (nr < 0 || nr >= 8 || nc < 0 || nc >= 8) break;
            const cur = b[nr][nc];
            if (!cur) {
              moves.push({ r: nr, c: nc, jumped: opp });
            } else {
              if (opp) break;
              if (cur.color === piece.color) break;
              opp = { r: nr, c: nc };
            }
            step++;
          }
        });
      }

      // لێدانی زۆرەملێ
      const jumps = moves.filter(m => m.jumped !== null);
      return jumps.length > 0 ? jumps : moves;
    }

    function executeMove(from, to) {
      const piece = board[from.r][from.c];
      board[from.r][from.c] = null;
      board[to.r][to.c] = piece;

      if (to.jumped) {
        board[to.jumped.r][to.jumped.c] = null;
      }

      // شا بوون
      if (piece.color === 'white' && to.r === 0) piece.isKing = true;
      if (piece.color === 'black' && to.r === 7) piece.isKing = true;

      // لێدانی بەردەوام (زنجیرەیی)
      if (to.jumped) {
        const nextJumps = getValidMoves(to.r, to.c, board).filter(m => m.jumped !== null);
        if (nextJumps.length > 0) {
          if (currentTurn === 'white') {
            selectedCell = { r: to.r, c: to.c };
            validMoves = nextJumps;
            renderBoard();
            return;
          } else {
            setTimeout(() => executeMove({ r: to.r, c: to.c }, nextJumps[0]), 350);
            return;
          }
        }
      }

      currentTurn = (currentTurn === 'white') ? 'black' : 'white';
      selectedCell = null;
      validMoves = [];
      renderBoard();
      updateStatus();

      if (checkGameOver()) return;

      // ئەگەر کەسی ئۆنلاین نەبێت، دەستبەجێ ئەی ئای وەڵام دەداتەوە
      if (currentTurn === 'black' && !isOnlinePeer) {
        setTimeout(playMasterAI, 450);
      } else if (socket && isOnlinePeer) {
        socket.emit('dama_send_move', { from, to, board, nextTurn: currentTurn });
      }
    }

    // ================== ئەی ئای زۆر بەهێز و بێ بەزەیی (Master AI) ==================
    function playMasterAI() {
      let allJumps = [];
      let allRegulars = [];

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          if (board[r][c]?.color === 'black') {
            const moves = getValidMoves(r, c, board);
            moves.forEach(m => {
              const item = { from: { r, c }, to: m, isKing: board[r][c].isKing };
              if (m.jumped) allJumps.push(item);
              else allRegulars.push(item);
            });
          }
        }
      }

      const pool = allJumps.length > 0 ? allJumps : allRegulars;

      if (pool.length === 0) {
        alert('🎉 ڕۆبۆتەکە گەمارۆ درا و ڕێگەی نەما! تۆ بردتەوە!');
        initBoard();
        return;
      }

      let bestMove = null;
      let highestScore = -Infinity;

      pool.forEach(cand => {
        let score = evaluateMove(cand);
        if (score > highestScore) {
          highestScore = score;
          bestMove = cand;
        }
      });

      if (bestMove) {
        executeMove(bestMove.from, bestMove.to);
      }
    }

    function evaluateMove(cand) {
      let score = 0;

      // ١. گرنگی خواردنی پوولی تۆ
      if (cand.to.jumped) {
        const victim = board[cand.to.jumped.r][cand.to.jumped.c];
        score += victim?.isKing ? 350 : 120;
      }

      // ٢. بەدەستهێنانی شا (King)
      if (!cand.isKing && cand.to.r === 7) {
        score += 220;
      }

      // ٣. جموجۆڵی شا
      if (cand.isKing) {
        score += 40;
      }

      // ٤. کۆنتڕۆڵکردنی ناوەڕاستی تەختە
      if (cand.to.r >= 3 && cand.to.r <= 5 && cand.to.c >= 2 && cand.to.c <= 5) {
        score += 25;
      }

      // ٥. پشکنینی ڕزگاربوون لە تەڵە و خواردن (Simulation)
      let sim = board.map(row => row.map(cell => cell ? { ...cell } : null));
      sim[cand.from.r][cand.from.c] = null;
      if (cand.to.jumped) sim[cand.to.jumped.r][cand.to.jumped.c] = null;
      sim[cand.to.r][cand.to.c] = { color: 'black', isKing: cand.isKing || cand.to.r === 7 };

      let willBeEaten = false;
      let whiteCounterJumps = 0;

      for (let wr = 0; wr < 8; wr++) {
        for (let wc = 0; wc < 8; wc++) {
          if (sim[wr][wc]?.color === 'white') {
            const oppMoves = getValidMoves(wr, wc, sim);
            oppMoves.forEach(om => {
              if (om.jumped) {
                whiteCounterJumps++;
                if (om.jumped.r === cand.to.r && om.jumped.c === cand.to.c) {
                  willBeEaten = true;
                }
              }
            });
          }
        }
      }

      // ئەگەر خۆی بە کوشت بدات، نمرەی لێ دەشکێت
      if (willBeEaten) {
        score -= cand.isKing ? 300 : 140;
      }

      score -= whiteCounterJumps * 40;

      return score;
    }

    function updateStatus() {
      const ind = document.getElementById('turn-indicator');
      if (currentTurn === 'white') {
        ind.innerText = '🎯 نۆبەی تۆیە';
        ind.style.borderColor = '#22c55e';
        ind.style.color = '#86efac';
      } else {
        ind.innerText = '🧠 نۆبەی ئەی ئایە...';
        ind.style.borderColor = '#f59e0b';
        ind.style.color = '#fbbf24';
      }
    }

    function checkGameOver() {
      let bCount = 0, wCount = 0;
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          if (board[r][c]?.color === 'black') bCount++;
          if (board[r][c]?.color === 'white') wCount++;
        }
      }

      if (bCount === 0 || wCount === 0) {
        const winner = bCount === 0 ? 'سپی (تۆ)' : 'ڕەش (کۆمپیوتەر)';
        alert(`🏆 یاری کۆتایی هات! پوولی ${winner} بردیەوە!`);
        location.reload();
        return true;
      }
      return false;
    }
  </script>
</body>
</html>
