<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بەشی قوتابیان - Kurd AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b1329;
            --card-bg: #152238;
            --accent-color: #ffb703;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --input-bg: #0d1b2a;
            --success-color: #2a9d8f;
            --danger-color: #e63946;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; padding-bottom: 3rem; }
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 1.5rem; background-color: #091024; border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 50;
        }
        .logo { font-size: 1.15rem; font-weight: bold; color: var(--accent-color); }
        .back-btn {
            color: var(--accent-color); border: 1px solid var(--accent-color);
            padding: 0.45rem 1rem; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 0.9rem;
        }
        .container { max-width: 900px; margin: 1.5rem auto; padding: 0 1rem; }
        .section-card {
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 14px; padding: 1.5rem; margin-bottom: 1.5rem;
        }
        .section-title {
            font-size: 1.15rem; color: var(--accent-color); margin-bottom: 1rem;
            display: flex; align-items: center; gap: 8px;
        }
        .media-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1rem; }
        .media-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
            background-color: var(--input-bg); border: 1.5px dashed var(--accent-color);
            color: #fff; padding: 1rem; border-radius: 10px; cursor: pointer; font-weight: bold;
        }
        .media-btn.gallery { border-color: var(--success-color); }
        .preview-box { position: relative; display: none; width: fit-content; margin: 0 auto 1rem auto; }
        .preview-box img { max-width: 240px; max-height: 240px; border-radius: 10px; border: 2px solid var(--accent-color); }
        .remove-btn {
            position: absolute; top: -10px; right: -10px; background: var(--danger-color);
            color: #fff; border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-weight: bold;
        }
        textarea {
            width: 100%; height: 110px; background-color: var(--input-bg); border: 1px solid var(--border-color);
            border-radius: 10px; color: #fff; padding: 1rem; font-size: 1rem; margin-bottom: 1rem; outline: none;
        }
        .actions { display: flex; gap: 12px; flex-wrap: wrap; }
        .select-subject {
            background-color: var(--input-bg); color: #fff; border: 1px solid var(--border-color);
            padding: 0.8rem 1rem; border-radius: 10px; flex: 1; font-size: 0.95rem;
        }
        .btn-submit {
            background-color: var(--accent-color); color: #000; border: none; padding: 0.8rem 1.5rem;
            border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; flex: 1;
        }
        .btn-submit:disabled { opacity: 0.6; }
        .response-area {
            margin-top: 1.5rem; background-color: var(--input-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 1.2rem; display: none;
        }
        .response-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 0.8rem; padding-bottom: 0.6rem; border-bottom: 1px solid var(--border-color);
            color: var(--accent-color); font-weight: bold;
        }
        .copy-btn { background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 0.35rem 0.8rem; border-radius: 6px; cursor: pointer; }
        .response-text { line-height: 1.9; font-size: 1.05rem; color: #f1f5f9; white-space: pre-wrap; }
        
        /* بەشی کتێب و مەلزەمەکان */
        .tool-item {
            background-color: var(--input-bg); border: 1px solid var(--border-color);
            border-radius: 10px; padding: 1.1rem; text-decoration: none; color: #fff;
            display: flex; align-items: center; gap: 12px; transition: 0.2s;
        }
        .tool-item:hover { border-color: var(--accent-color); transform: translateY(-2px); }
        .tool-icon {
            width: 45px; height: 45px; border-radius: 10px; background: rgba(42, 157, 143, 0.15);
            color: var(--success-color); display: flex; align-items: center; justify-content: center; font-size: 1.3rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">بەشی قوتابیان - Kurd AI 🎓</div>
        <a href="index.html" class="back-btn">گەڕانەوە بۆ سەرەکی <i class="fa-solid fa-arrow-left"></i></a>
    </header>

    <div class="container">
        <!-- ١. بەشی شیکارکردنی پرسیار بە AI -->
        <div class="section-card">
            <div class="section-title"><i class="fa-solid fa-robot"></i> یاریدەدەری زیرەک (وێنە بگرە یان پرسیار بنووسە)</div>
            
            <div class="media-row">
                <label for="cameraInput" class="media-btn">
                    <i class="fa-solid fa-camera" style="color: #ffb703; font-size: 1.5rem;"></i>
                    <span>وێنەگرتن بە کامێرا</span>
                </label>
                <label for="galleryInput" class="media-btn gallery">
                    <i class="fa-solid fa-images" style="color: #2a9d8f; font-size: 1.5rem;"></i>
                    <span>هەڵبژاردن لە گەلەری</span>
                </label>
            </div>

            <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;" onchange="loadImg(event)">
            <input type="file" id="galleryInput" accept="image/*" style="display: none;" onchange="loadImg(event)">

            <div class="preview-box" id="previewBox">
                <img id="imgPreview" alt="پرسیار">
                <button type="button" class="remove-btn" onclick="clearImg()">✕</button>
            </div>

            <textarea id="questionInput" placeholder="پرسیارەکەت لێرە بنووسە... (ئەگەر وێنەت داناوە دەتوانیت بە بەتاڵی جێی بهێڵیت)"></textarea>

            <div class="actions">
                <select id="subjectSelect" class="select-subject">
                    <option value="گشتی">بابەت: گشتی</option>
                    <option value="بیرکاری">بیرکاری</option>
                    <option value="فیزیا / کیمیا / زیندەزانی">فیزیا / کیمیا / زیندەزانی</option>
                    <option value="زمانەکان">زمانەکان</option>
                </select>
                <button type="button" class="btn-submit" id="submitBtn" onclick="solveNow()">✨ شیکار بکە</button>
            </div>

            <div id="resultBox" class="response-area">
                <div class="response-header">
                    <span>✅ شیکاری ژیر:</span>
                    <button type="button" class="copy-btn" onclick="copyText()">کۆپیکردن</button>
                </div>
                <div class="response-text" id="responseText"></div>
            </div>
        </div>

        <!-- ٢. بەشی کتێب و مەلزەمەکان -->
        <div class="section-card">
            <div class="section-title"><i class="fa-solid fa-book-open"></i> سەرچاوەکان</div>
            <a href="materials.html" class="tool-item">
                <div class="tool-icon"><i class="fa-solid fa-file-pdf"></i></div>
                <div>
                    <div style="font-weight: bold; margin-bottom: 3px;">کتێب و مەلزەمەکان (PDF)</div>
                    <div style="font-size: 0.85rem; color: var(--text-muted);">دابەزاندنی مەلزەمە و پرسیارە وزارییەکان</div>
                </div>
            </a>
        </div>
    </div>

    <script>
        let imageBase64 = null;
        const API_BASE = window.location.origin.includes('railway.app') 
            ? '' 
            : 'https://kurd-domino-production.up.railway.app';

        function loadImg(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX = 900;
                    let w = img.width, h = img.height;
                    if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
                    canvas.width = w;
                    canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    imageBase64 = canvas.toDataURL('image/jpeg', 0.8);
                    document.getElementById('imgPreview').src = imageBase64;
                    document.getElementById('previewBox').style.display = 'block';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function clearImg() {
            imageBase64 = null;
            document.getElementById('cameraInput').value = '';
            document.getElementById('galleryInput').value = '';
            document.getElementById('previewBox').style.display = 'none';
        }

        async function solveNow() {
            const questionText = document.getElementById('questionInput').value.trim();
            const subject = document.getElementById('subjectSelect').value;
            const resultBox = document.getElementById('resultBox');
            const responseText = document.getElementById('responseText');
            const btn = document.getElementById('submitBtn');

            if (!questionText && !imageBase64) {
                alert('تکایە وێنەی پرسیارەکە دابنێ یان پرسیارێک بنووسە!');
                return;
            }

            btn.disabled = true;
            btn.innerText = '⏳ خەریکی شیکارکردنە...';
            resultBox.style.display = 'block';
            responseText.innerText = '⏳ تکایە چاوەڕێ بکە، زیرەکی دەستکرد خەریکی شیکارکردنی پرسیارەکەیە...';

            try {
                const res = await fetch(`${API_BASE}/api/solve-question`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ questionText, imageBase64, subject })
                });
                const data = await res.json();
                if (res.ok && data.answer) {
                    responseText.innerText = data.answer.replace(/\*\*/g, '').replace(/\$/g, '');
                } else {
                    responseText.innerText = '❌ هەڵە: ' + (data.error || 'وەڵام نەهاتەوە');
                }
            } catch (err) {
                responseText.innerText = '❌ هەڵەی پەیوەندی: ' + err.message;
            } finally {
                btn.disabled = false;
                btn.innerText = '✨ شیکار بکە';
            }
        }

        function copyText() {
            navigator.clipboard.writeText(document.getElementById('responseText').innerText)
                .then(() => alert('کۆپی کرا!'));
        }
    </script>
</body>
</html>
