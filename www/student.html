<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurd AI - بەشی قوتابیان</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b1329;
            --card-bg: #152238;
            --accent-color: #ffb703;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --input-bg: #0d1b2a;
            --success-color: #2a9d8f;
            --danger-color: #e63946;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; }
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.9rem 1rem; background-color: rgba(11, 19, 41, 0.98);
            border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 50;
        }
        .back-btn {
            background: transparent; color: var(--accent-color); border: 1px solid var(--accent-color);
            padding: 0.4rem 0.8rem; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 0.85rem;
        }
        .logo { font-size: 1rem; font-weight: bold; color: var(--accent-color); }
        .container { max-width: 900px; margin: 1.2rem auto; padding: 0 1rem; width: 100%; }
        .ai-box {
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 14px; padding: 1.2rem; margin-bottom: 1.5rem;
        }
        .ai-box h2 { font-size: 1.1rem; margin-bottom: 1rem; color: var(--accent-color); }
        .media-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1rem; }
        .media-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
            background-color: var(--input-bg); border: 1.5px dashed var(--accent-color);
            color: #fff; padding: 0.9rem; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.9rem;
        }
        .media-btn.gallery-btn { border-color: var(--success-color); }
        .preview-container { position: relative; display: none; width: fit-content; margin: 0.8rem auto; }
        .image-preview { max-width: 220px; max-height: 220px; border-radius: 10px; border: 2px solid var(--accent-color); display: block; }
        .remove-img-btn {
            position: absolute; top: -10px; right: -10px; background: var(--danger-color);
            color: #fff; border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
        }
        textarea {
            width: 100%; height: 100px; background-color: var(--input-bg); border: 1px solid var(--border-color);
            border-radius: 8px; color: #fff; padding: 0.9rem; font-size: 1rem; margin-bottom: 0.8rem; outline: none;
        }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .select-subject {
            background-color: var(--input-bg); color: #fff; border: 1px solid var(--border-color);
            padding: 0.75rem; border-radius: 8px; flex: 1; font-size: 0.95rem;
        }
        .btn-submit {
            background-color: var(--accent-color); color: #000; border: none; padding: 0.75rem 1.5rem;
            border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; flex: 1;
        }
        .btn-submit:disabled { opacity: 0.6; }
        .response-area {
            margin-top: 1.2rem; background-color: var(--input-bg); border: 1px solid var(--border-color);
            border-radius: 10px; padding: 1rem; display: none;
        }
        .response-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 0.8rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border-color);
            color: var(--accent-color); font-weight: bold;
        }
        .copy-btn { background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 0.3rem 0.7rem; border-radius: 5px; cursor: pointer; }
        .response-text { line-height: 1.8; font-size: 1rem; color: #f1f5f9; white-space: pre-wrap; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i> سەرەکی</a>
        <div class="logo">بەشی قوتابیان - Kurd AI 🎓</div>
    </header>

    <div class="container">
        <div class="ai-box">
            <h2><i class="fa-solid fa-robot"></i> وێنەی پرسیار بگرە یان بینووسە</h2>

            <div class="media-buttons">
                <button type="button" class="media-btn" onclick="document.getElementById('cameraInput').click()">
                    <i class="fa-solid fa-camera" style="color: #ffb703; font-size: 1.5rem;"></i>
                    <span>وێنەگرتن بە کامێرا</span>
                </button>
                <button type="button" class="media-btn gallery-btn" onclick="document.getElementById('galleryInput').click()">
                    <i class="fa-solid fa-images" style="color: #2a9d8f; font-size: 1.5rem;"></i>
                    <span>هەڵبژاردن لە گەلەری</span>
                </button>
            </div>

            <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;" onchange="handleImageSelect(event)">
            <input type="file" id="galleryInput" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">

            <div class="preview-container" id="previewContainer">
                <img id="imagePreview" class="image-preview" alt="پێشبینی وێنە">
                <button type="button" class="remove-img-btn" onclick="clearSelectedImage()">✕</button>
            </div>

            <textarea id="questionInput" placeholder="پرسیارەکەت لێرە بنووسە یان وێنەی پرسیارەکە دابنێ..."></textarea>

            <div class="actions">
                <select id="subjectSelect" class="select-subject">
                    <option value="گشتی">بابەت: گشتی</option>
                    <option value="بیرکاری">بیرکاری</option>
                    <option value="فیزیا / کیمیا / زیندەزانی">فیزیا / کیمیا / زیندەزانی</option>
                    <option value="زمانەکان">زمانەکان (کوردی / ئینگلیزی / عەرەبی)</option>
                </select>
                <button class="btn-submit" id="submitBtn" onclick="solveQuestion()">✨ شیکار بکە</button>
            </div>

            <div id="resultBox" class="response-area">
                <div class="response-header">
                    <span>✅ وەڵام و شیکار:</span>
                    <button class="copy-btn" onclick="copyResultText()">کۆپیکردن</button>
                </div>
                <div class="response-text" id="responseText"></div>
            </div>
        </div>
    </div>

    <script>
        let base64ImageData = null;
        const SERVER_URL = "https://kurd-domino-production.up.railway.app";

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1024;
                    let width = img.width;
                    let height = img.height;
                    if (width > MAX_WIDTH) {
                        height = Math.round((height * MAX_WIDTH) / width);
                        width = MAX_WIDTH;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    base64ImageData = canvas.toDataURL('image/jpeg', 0.8);
                    document.getElementById('imagePreview').src = base64ImageData;
                    document.getElementById('previewContainer').style.display = 'block';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function clearSelectedImage() {
            document.getElementById('cameraInput').value = '';
            document.getElementById('galleryInput').value = '';
            base64ImageData = null;
            document.getElementById('previewContainer').style.display = 'none';
        }

        async function solveQuestion() {
            const textValue = document.getElementById('questionInput').value.trim();
            const subject = document.getElementById('subjectSelect').value;
            const resultBox = document.getElementById('resultBox');
            const responseText = document.getElementById('responseText');
            const submitBtn = document.getElementById('submitBtn');

            if (!textValue && !base64ImageData) {
                alert('تکایە سەرەتا پرسیارێک بنووسە یان وێنەی پرسیارەکە بگرە!');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = '⏳ خەریکی شیکارکردنە...';
            resultBox.style.display = 'block';
            responseText.innerText = 'تکایە کەمێک چاوەڕێ بکە، زیرەکی دەستکرد خەریکی خوێندنەوەی پرسیارەکەیە...';

            try {
                const res = await fetch(`${SERVER_URL}/api/solve-question`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        questionText: textValue,
                        imageBase64: base64ImageData,
                        subject: subject
                    })
                });
                const data = await res.json();
                if (res.ok && data.answer) {
                    responseText.innerText = data.answer;
                } else {
                    responseText.innerText = "هەڵەی سێرڤەر: " + (data.error || JSON.stringify(data));
                }
            } catch (err) {
                responseText.innerText = "هەڵەی پەیوەندی: " + err.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = '✨ شیکار بکە';
            }
        }

        function copyResultText() {
            const text = document.getElementById('responseText').innerText;
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => alert('وەڵامەکە کۆپی کرا!'));
        }
    </script>
</body>
</html>
