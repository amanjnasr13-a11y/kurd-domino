<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کۆنتڕۆڵی بەڕێوەبەر (Admin Panel) - Kurd AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: #0b1320; color: #fff; padding-bottom: 50px; }
    .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background-color: #060b13; border-bottom: 1px solid #1f2937; gap: 10px; }
    .nav-title { font-size: 20px; font-weight: bold; color: #ef4444; }
    .nav-actions { display: flex; align-items: center; gap: 8px; }
    .btn-back { color: #9ca3af; text-decoration: none; font-size: 14px; border: 1px solid #374151; padding: 6px 14px; border-radius: 8px; }
    .btn-logout { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.45); font-size: 13px; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .container { max-width: 1120px; margin: 26px auto; padding: 0 20px; }

    /* Main Section Switcher */
    .main-sections { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    .sec-btn {
      background: #111927;
      color: #e5e7eb;
      border: 1.5px solid #374151;
      padding: 11px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: all 0.2s ease;
    }
    .sec-btn.active {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0b1320;
      border-color: #f59e0b;
    }

    .tabs { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; border-bottom: 1px solid #1f2937; padding-bottom: 12px; }
    .tab-btn { background: #111927; color: #fff; border: 1px solid #374151; padding: 9px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; }
    .tab-btn.active { background: #f59e0b; color: #0b1320; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 20px; }
    .admin-card { background: #111927; border: 1px solid #374151; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .admin-card img { width: 100%; height: 160px; object-fit: cover; }
    .card-content { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
    .badge { display: inline-block; padding: 4px 9px; border-radius: 6px; font-size: 11px; font-weight: bold; width: fit-content; margin-bottom: 8px; }
    .badge-pending { background: #78350f; color: #fde68a; }
    .badge-approved { background: #064e3b; color: #6ee7b7; }
    .actions { display: flex; gap: 8px; margin-top: 15px; }
    .btn-approve { flex: 1; background: #10b981; color: #fff; border: none; padding: 9px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-reject { flex: 1; background: #ef4444; color: #fff; border: none; padding: 9px; border-radius: 6px; cursor: pointer; font-weight: bold; }

    /* Rates Editor Styles */
    .rates-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 18px; margin-bottom: 20px; }
    .rate-box { background: #111927; border: 1px solid #374151; border-radius: 14px; padding: 18px; }
    .rate-box.women-box { border-color: #ec4899; }
    .rate-box h3 { color: #f59e0b; margin-bottom: 14px; font-size: 16px; border-bottom: 1px solid #1f2937; padding-bottom: 8px; }
    .rate-box.women-box h3 { color: #f472b6; }
    .rate-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 11px; }
    .rate-field label { font-size: 12px; color: #9ca3af; font-weight: bold; }
    .rate-field input {
      background: #0b1320;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 9px 11px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }
    .rate-field input:focus { border-color: #f59e0b; }
    .save-rates-btn {
      background: #10b981;
      color: #06130e;
      border: none;
      padding: 13px 26px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .admin-section { display: none; }
    .admin-section.active { display: block; }

    /* پەنجەرەی داخڵبوونی ئەدمین */
    #loginModal {
      position: fixed;
      inset: 0;
      background: #0b1320;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-box {
      background: #111927;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <!-- پەنجەرەی پاسۆردی ئەدمین -->
  <div id="loginModal">
    <div class="login-box">
      <h2 style="color: #ef4444; margin-bottom: 10px;">🔒 تابلۆی بەڕێوەبەر</h2>
      <p style="color: #9ca3af; font-size: 13px; margin-bottom: 20px;">تکایە وشەی نهێنی بنووسە بۆ چوونەژوورەوە</p>
      
      <form id="adminLoginForm" onsubmit="handleLogin(event)">
        <input type="password" id="passInput" placeholder="وشەی نهێنی (پاسۆرد)" required 
               style="width: 100%; padding: 12px; background: #0b1320; border: 1px solid #374151; border-radius: 8px; color: #fff; text-align: center; font-size: 16px; outline: none; margin-bottom: 15px;">
        <button type="submit" 
                style="width: 100%; padding: 12px; background: #f59e0b; color: #0b1320; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer;">
          چوونەژوورەوە
        </button>
      </form>
      <a href="index.html" style="display: inline-block; margin-top: 15px; color: #9ca3af; text-decoration: none; font-size: 13px;">← گەڕانەوە بۆ لاپەڕەی سەرەکی</a>
    </div>
  </div>

  <header class="navbar">
    <div class="nav-actions">
      <a href="index.html" class="btn-back">← پەڕەی سەرەکی</a>
      <button class="btn-logout" onclick="logoutAdmin()">🔒 چوونەدەرەوە</button>
    </div>
    <div class="nav-title">کۆنتڕۆڵی بەڕێوەبەر (Admin)</div>
  </header>

  <div class="container">
    <!-- بەشە سەرەکییەکانی ئەدمین -->
    <div class="main-sections">
      <button class="sec-btn active" id="secBtnMarket" onclick="switchAdminSection('market')">🛒 کاڵاکانی بازاڕ</button>
      <button class="sec-btn" id="secBtnPros" onclick="switchAdminSection('pros')">🛠️ پیشەوەرەکان</button>
      <button class="sec-btn" id="secBtnOrders" onclick="switchAdminSection('orders')">🚖 داواکاری تەکسی و گەیاندن</button>
      <button class="sec-btn" id="secBtnDrivers" onclick="switchAdminSection('drivers')">🪪 شۆفێرەکان</button>
      <button class="sec-btn" id="secBtnRates" onclick="switchAdminSection('rates')">💰 نرخەکانی تەکسی و کاڵا</button>
    </div>

    <!-- ١. بەشی کاڵاکانی بازاڕ -->
    <div class="admin-section active" id="section-market">
      <div class="tabs">
        <button class="tab-btn active" id="tabPending" onclick="filterStatus('pending')">چاوەڕوانکراو (Pending)</button>
        <button class="tab-btn" id="tabApproved" onclick="filterStatus('approved')">پەسەندکراوەکان (Approved)</button>
        <button class="tab-btn" id="tabAll" onclick="filterStatus('all')">هەموو کاڵاکان</button>
      </div>

      <div class="grid" id="adminGrid">
        <p style="color: #9ca3af; text-align: center; grid-column: 1 / -1;">باردەکرێت...</p>
      </div>
    </div>

    <!-- ٢. بەشی پیشەوەرەکان -->
    <div class="admin-section" id="section-pros">
      <div class="grid" id="prosAdminGrid">
        <p style="color: #9ca3af; text-align: center; grid-column: 1 / -1;">باردەکرێت...</p>
      </div>
    </div>

    <!-- ٣. بەشی داواکاری تەکسی و گەیاندنی کاڵا -->
    <div class="admin-section" id="section-orders">
      <div class="tabs">
        <button class="tab-btn active" id="tabRideOrders" onclick="switchOrderTab('rides')">🚖 داواکارییەکانی تەکسی</button>
        <button class="tab-btn" id="tabCargoOrders" onclick="switchOrderTab('cargo')">📦 داواکارییەکانی گەیاندنی کاڵا</button>
      </div>
      <div class="grid" id="ordersGrid"></div>
    </div>

    <!-- ٤. بەشی شۆفێران -->
    <div class="admin-section" id="section-drivers">
      <div class="grid" id="driversAdminGrid"></div>
    </div>

    <!-- ٥. بەشی دەستکاریکردنی نرخەکان -->
    <div class="admin-section" id="section-rates">
      <div class="rates-grid" id="ratesEditorGrid"></div>
      <button class="save-rates-btn" onclick="saveTaxiRates()">💾 پاشەکەوتکردنی نرخە نوێیەکان</button>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin.startsWith('http')
      ? window.location.origin
      : 'https://kurd-domino-production.up.railway.app';

    function checkLoginStatus() {
      sessionStorage.removeItem('admin_logged');
      document.getElementById('loginModal').style.display = 'flex';
    }

    function logoutAdmin() {
      sessionStorage.removeItem('admin_logged');
      document.getElementById('passInput').value = '';
      document.getElementById('loginModal').style.display = 'flex';
    }

    function handleLogin(e) {
      e.preventDefault();
      const input = document.getElementById('passInput').value.trim();
      let normalized = input.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
                            .replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));

      if (normalized === "123456") {
        document.getElementById('passInput').value = '';
        document.getElementById('loginModal').style.display = 'none';
        fetchAdminItems();
        fetchAdminPros();
        fetchTaxiAdminData();
      } else {
        alert("❌ وشەی نهێنی هەڵەیە! تکایە دووبارە تاقی بکەرەوە.");
        document.getElementById('passInput').value = '';
      }
    }

    function switchAdminSection(sec) {
      ['market', 'pros', 'orders', 'drivers', 'rates'].forEach(s => {
        document.getElementById('section-' + s).classList.toggle('active', s === sec);
      });
      document.getElementById('secBtnMarket').classList.toggle('active', sec === 'market');
      document.getElementById('secBtnPros').classList.toggle('active', sec === 'pros');
      document.getElementById('secBtnOrders').classList.toggle('active', sec === 'orders');
      document.getElementById('secBtnDrivers').classList.toggle('active', sec === 'drivers');
      document.getElementById('secBtnRates').classList.toggle('active', sec === 'rates');

      if (sec === 'pros') fetchAdminPros();
      else if (sec !== 'market') fetchTaxiAdminData();
    }

    // --- بازاڕ ---
    let allItems = [];
    let currentFilter = 'pending';

    async function fetchAdminItems() {
      try {
        const res = await fetch(`${API_BASE}/api/admin/marketplace/items`);
        allItems = await res.json();
        renderAdminCards();
      } catch (err) {
        document.getElementById('adminGrid').innerHTML = '<p style="color:#ef4444;">هەڵە لە هێنانی داتاکان.</p>';
      }
    }

    function filterStatus(status) {
      currentFilter = status;
      document.querySelectorAll('#section-market .tab-btn').forEach(btn => btn.classList.remove('active'));
      if (status === 'pending') document.getElementById('tabPending').classList.add('active');
      if (status === 'approved') document.getElementById('tabApproved').classList.add('active');
      if (status === 'all') document.getElementById('tabAll').classList.add('active');
      renderAdminCards();
    }

    function renderAdminCards() {
      const grid = document.getElementById('adminGrid');
      grid.innerHTML = '';

      let list = allItems;
      if (currentFilter !== 'all') {
        list = allItems.filter(item => item.status === currentFilter);
      }

      if (list.length === 0) {
        grid.innerHTML = '<p style="color: #9ca3af; text-align: center; grid-column: 1 / -1;">هیچ کاڵایەک لەم بەشەدا نییە.</p>';
        return;
      }

      list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'admin-card';

        const isPending = item.status === 'pending';
        const badgeClass = isPending ? 'badge-pending' : 'badge-approved';
        const badgeText = isPending ? '⏳ لە چاوەڕوانیدایە' : '✅ پەسەندکراوە';

        card.innerHTML = `
          <img src="${item.img}" alt="${item.title}">
          <div class="card-content">
            <span class="badge ${badgeClass}">${badgeText}</span>
            <h3 style="margin-bottom: 5px;">${item.title}</h3>
            <p style="color: #10b981; font-weight: bold; margin-bottom: 4px;">${item.price}</p>
            <p style="color: #9ca3af; font-size: 13px;">📍 ${item.city} | بەش: ${item.category}</p>
            <p style="color: #38bdf8; font-size: 13px; margin-top: 4px;">📞 ${item.phone}</p>
            
            <div class="actions">
              ${isPending ? `<button class="btn-approve" onclick="approveItem(${item.id})">✔ قبووڵکردن</button>` : ''}
              <button class="btn-reject" onclick="rejectItem(${item.id})">✖ سڕینەوە</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function approveItem(id) {
      if (!confirm('ئایا دڵنیایت لە قبووڵکردنی ئەم کاڵایە بۆ ناو بازاڕ؟')) return;
      const res = await fetch(`${API_BASE}/api/admin/marketplace/approve/${id}`, { method: 'POST' });
      const data = await res.json();
      if (data.success) fetchAdminItems();
    }

    async function rejectItem(id) {
      if (!confirm('ئایا دڵنیایت لە سڕینەوە و ڕەتکردنەوەی ئەم کاڵایە؟')) return;
      const res = await fetch(`${API_BASE}/api/admin/marketplace/reject/${id}`, { method: 'DELETE' });
      const data = await res.json();
      if (data.success) fetchAdminItems();
    }

    // --- پیشەوەرەکان ---
    let allPros = [];

    async function fetchAdminPros() {
      try {
        const res = await fetch(`${API_BASE}/api/admin/professionals`);
        if (res.ok) {
          allPros = await res.json();
          renderProsAdminGrid();
        }
      } catch (e) {
        document.getElementById('prosAdminGrid').innerHTML = '<p style="color:#ef4444;">هەڵە لە هێنانی پیشەوەرەکان.</p>';
      }
    }

    function renderProsAdminGrid() {
      const grid = document.getElementById('prosAdminGrid');
      if (!allPros || allPros.length === 0) {
        grid.innerHTML = '<p style="color:#9ca3af; text-align:center; grid-column:1/-1;">هیچ پیشەوەرێک تۆمار نەکراوە.</p>';
        return;
      }

      grid.innerHTML = allPros.map(p => {
        const isPending = p.status === 'pending';
        return `
          <div class="admin-card">
            <div class="card-content">
              <span class="badge ${isPending ? 'badge-pending' : 'badge-approved'}">
                ${isPending ? '⏳ چاوەڕوانی پەسەندکردن' : '✅ پەسەندکراوە'}
              </span>
              <h3 style="margin-bottom:5px;">🛠️ ${p.name}</h3>
              <p style="font-size:13px; color:#f59e0b; font-weight:bold;">⚙️ ${p.job} — 📍 ${p.city}</p>
              <p style="font-size:13px; color:#cbd5e1; margin-top:5px;">${p.bio || ''}</p>
              <p style="font-size:13px; color:#38bdf8; margin-top:6px;">📞 ${p.phone}</p>
              <div class="actions">
                ${isPending ? `<button class="btn-approve" onclick="approvePro(${p.id})">✔ پەسەندکردن</button>` : ''}
                <button class="btn-reject" onclick="rejectPro(${p.id})">✖ سڕینەوە</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function approvePro(id) {
      if (!confirm('دڵنیایت لە پەسەندکردنی ئەم پیشەوەرە؟')) return;
      const res = await fetch(`${API_BASE}/api/admin/professionals/approve/${id}`, { method: 'POST' });
      const data = await res.json();
      if (data.success) fetchAdminPros();
    }

    async function rejectPro(id) {
      if (!confirm('دڵنیایت لە سڕینەوەی ئەم پیشەوەرە؟')) return;
      const res = await fetch(`${API_BASE}/api/admin/professionals/reject/${id}`, { method: 'DELETE' });
      const data = await res.json();
      if (data.success) fetchAdminPros();
    }

    // --- تەکسی، گەیاندن، شۆفێران و نرخەکان ---
    let taxiDb = { rates: null, rideOrders: [], deliveryOrders: [], driverRequests: [] };
    let currentOrderTab = 'rides';

    async function fetchTaxiAdminData() {
      try {
        const res = await fetch(`${API_BASE}/api/admin/taxi`);
        if (res.ok) {
          taxiDb = await res.json();
          renderOrdersGrid();
          renderDriversGrid();
          renderRatesEditor();
        }
      } catch (e) {}
    }

    function switchOrderTab(tab) {
      currentOrderTab = tab;
      document.getElementById('tabRideOrders').classList.toggle('active', tab === 'rides');
      document.getElementById('tabCargoOrders').classList.toggle('active', tab === 'cargo');
      renderOrdersGrid();
    }

    function renderOrdersGrid() {
      const grid = document.getElementById('ordersGrid');
      const list = currentOrderTab === 'rides' ? taxiDb.rideOrders : taxiDb.deliveryOrders;

      if (!list || list.length === 0) {
        grid.innerHTML = '<p style="color:#9ca3af; text-align:center; grid-column:1/-1;">هیچ داواکارییەک تۆمار نەکراوە.</p>';
        return;
      }

      grid.innerHTML = list.map(o => {
        const isAccepted = o.status === 'accepted';
        const isWomen = o.taxiCategory === 'women' || (o.tier && o.tier.includes('ئافرەتان'));
        const badge = isAccepted
          ? '<span class="badge badge-approved">✅ وەرگیراوە لەلایەن شۆفێر</span>'
          : '<span class="badge badge-pending">⏳ لە چاوەڕوانی شۆفێردایە</span>';

        if (currentOrderTab === 'rides') {
          return `
            <div class="admin-card" style="${isWomen ? 'border-color:#ec4899;' : ''}">
              <div class="card-content">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  ${badge}
                  ${isWomen ? '<span class="badge" style="background:#831843; color:#fbcfe8;">👩🏻‍✈️ تەکسی ئافرەتان</span>' : ''}
                </div>
                <h3 style="margin-bottom:6px; color:${isWomen ? '#f472b6' : '#f59e0b'};">🚖 ${o.passengerName || 'سەرنشین'}</h3>
                <p style="font-size:13px; color:#e5e7eb; margin-bottom:4px;">📍 لە: ${o.pickup}</p>
                <p style="font-size:13px; color:#e5e7eb; margin-bottom:6px;">🏁 بۆ: ${o.dropoff}</p>
                <p style="font-size:13px; color:#10b981; font-weight:bold;">💰 نرخ: ${o.estimatedPrice} (${o.distanceKm || ''})</p>
                <p style="font-size:13px; color:#38bdf8; margin-top:4px;">📞 مۆبایل: ${o.passengerPhone}</p>
              </div>
            </div>
          `;
        } else {
          return `
            <div class="admin-card">
              <div class="card-content">
                ${badge}
                <h3 style="margin-bottom:6px; color:#f59e0b;">📦 ${o.cargoDesc || 'کاڵا'} (${o.tier || ''})</h3>
                <p style="font-size:13px; color:#e5e7eb; margin-bottom:4px;">📍 لە: ${o.origin}</p>
                <p style="font-size:13px; color:#e5e7eb; margin-bottom:6px;">🏁 بۆ: ${o.destination}</p>
                <p style="font-size:13px; color:#10b981; font-weight:bold;">💰 نرخ: ${o.estimatedPrice}</p>
                <p style="font-size:12px; color:#38bdf8; margin-top:4px;">📞 نێرەر: ${o.senderPhone} | وەرگر: ${o.receiverPhone}</p>
              </div>
            </div>
          `;
        }
      }).join('');
    }

    function renderDriversGrid() {
      const grid = document.getElementById('driversAdminGrid');
      const list = taxiDb.driverRequests || [];

      if (list.length === 0) {
        grid.innerHTML = '<p style="color:#9ca3af; text-align:center; grid-column:1/-1;">هیچ داواکارییەکی شۆفێر نییە.</p>';
        return;
      }

      grid.innerHTML = list.map(d => {
        const isPending = d.status === 'pending';
        return `
          <div class="admin-card">
            <div class="card-content">
              <span class="badge ${isPending ? 'badge-pending' : 'badge-approved'}">
                ${isPending ? '⏳ چاوەڕوانی پەسەندکردن' : '✅ شۆفێری پەسەندکراو'}
              </span>
              <h3 style="margin-bottom:5px;">🪪 ${d.name}</h3>
              <p style="font-size:13px; color:#cbd5e1;">🚗 ${d.car} — تابلۆ: ${d.plate}</p>
              <p style="font-size:13px; color:#9ca3af; margin-top:3px;">📍 شار: ${d.city}</p>
              <p style="font-size:13px; color:#38bdf8; margin-top:4px;">📞 ${d.phone}</p>
              <div class="actions">
                ${isPending ? `<button class="btn-approve" onclick="approveDriver(${d.id})">✔ پەسەندکردن</button>` : ''}
                <button class="btn-reject" onclick="rejectDriver(${d.id})">✖ سڕینەوە</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function approveDriver(id) {
      if (!confirm('دڵنیایت لە پەسەندکردنی ئەم شۆفێرە؟')) return;
      const res = await fetch(`${API_BASE}/api/admin/taxi/drivers/approve/${id}`, { method: 'POST' });
      const data = await res.json();
      if (data.success) fetchTaxiAdminData();
    }

    async function rejectDriver(id) {
      if (!confirm('دڵنیایت لە سڕینەوەی ئەم شۆفێرە؟')) return;
      const res = await fetch(`${API_BASE}/api/admin/taxi/drivers/reject/${id}`, { method: 'DELETE' });
      const data = await res.json();
      if (data.success) fetchTaxiAdminData();
    }

    function renderRatesEditor() {
      const grid = document.getElementById('ratesEditorGrid');
      if (!taxiDb.rates) return;
      const womenData = taxiDb.rates.taxi.women || taxiDb.rates.taxi.standard;

      const entries = [
        { group: 'taxi', key: 'standard', title: '🚖 تەکسی گشتی', isWomen: false, data: taxiDb.rates.taxi.standard },
        { group: 'taxi', key: 'women', title: '👩🏻‍✈️ تەکسی ئافرەتان', isWomen: true, data: womenData },
        { group: 'delivery', key: 'moto', title: '🛵 ماتۆڕی گەیاندن', isWomen: false, data: taxiDb.rates.delivery.moto },
        { group: 'delivery', key: 'taxi_cargo', title: '🚖 تەکسی کاڵا', isWomen: false, data: taxiDb.rates.delivery.taxi_cargo },
        { group: 'delivery', key: 'van', title: '🚚 پیکاب / بارهەڵگر', isWomen: false, data: taxiDb.rates.delivery.van }
      ];

      grid.innerHTML = entries.map(item => `
        <div class="rate-box ${item.isWomen ? 'women-box' : ''}">
          <h3>${item.title}</h3>
          <div class="rate-field">
            <label>نرخی دەستپێک (دینار):</label>
            <input type="number" id="rate-${item.group}-${item.key}-base" value="${item.data.base}">
          </div>
          <div class="rate-field">
            <label>نرخی هەر کیلۆمەترێک (دینار / کم):</label>
            <input type="number" id="rate-${item.group}-${item.key}-perKm" value="${item.data.perKm}">
          </div>
          <div class="rate-field">
            <label>نرخی هەر خولەکێک (دینار / خولەک):</label>
            <input type="number" id="rate-${item.group}-${item.key}-perMin" value="${item.data.perMin}">
          </div>
          <div class="rate-field">
            <label>کەمترین نرخی گەشت (Minimum Fare):</label>
            <input type="number" id="rate-${item.group}-${item.key}-minFare" value="${item.data.minFare}">
          </div>
        </div>
      `).join('');
    }

    async function saveTaxiRates() {
      const readBox = (group, key, label) => ({
        label,
        base: Number(document.getElementById(`rate-${group}-${key}-base`).value) || 0,
        perKm: Number(document.getElementById(`rate-${group}-${key}-perKm`).value) || 0,
        perMin: Number(document.getElementById(`rate-${group}-${key}-perMin`).value) || 0,
        minFare: Number(document.getElementById(`rate-${group}-${key}-minFare`).value) || 0
      });

      const updatedRates = {
        taxi: {
          standard: readBox('taxi', 'standard', 'تەکسی گشتی'),
          women: readBox('taxi', 'women', 'تەکسی ئافرەتان')
        },
        delivery: {
          moto: readBox('delivery', 'moto', 'ماتۆڕی گەیاندن'),
          taxi_cargo: readBox('delivery', 'taxi_cargo', 'تەکسی کاڵا'),
          van: readBox('delivery', 'van', 'پیکاب / بارهەڵگر')
        }
      };

      try {
        const res = await fetch(`${API_BASE}/api/admin/taxi/rates`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updatedRates)
        });
        const data = await res.json();
        if (data.success) {
          alert('✅ نرخە نوێیەکان بە سەرکەوتوویی پاشەکەوت کران و ڕاستەوخۆ لای سەرنشین چالاک بوون!');
          fetchTaxiAdminData();
        }
      } catch (e) {
        alert('❌ هەڵە لە پاشەکەوتکردنی نرخەکان.');
      }
    }

    checkLoginStatus();
  </script>
</body>
</html>
